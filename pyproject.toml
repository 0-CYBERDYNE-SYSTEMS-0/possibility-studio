[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "possibility-studio"
version = "0.1.0"
description = "A local creative coding workbench for exploring and refining standalone HTML prototypes."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
browser = ["playwright>=1.48,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["studio*"]

[tool.setuptools.package-data]
studio = ["static/*", "static/vendor/*"]
